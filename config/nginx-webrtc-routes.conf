# ================================================================
# NOTES ON INTEGRATION
# ================================================================
#
# 1. SSL/TLS:
#    - Existing SSL certificates cover these routes (dev.gmai.sa, api.gmai.sa)
#    - No additional certificate configuration needed
#    - WebRTC signaling requires HTTPS (enforced by existing config)
#
# 2. CORS:
#    - api.gmai.sa already has CORS headers at server block level
#    - dev.gmai.sa routes to localhost:8000 (no CORS needed, same origin)
#    - WebRTC endpoints inherit existing CORS configuration
#
# 3. Timeouts:
#    - Health checks: 5s (fast feedback)
#    - SDP offer/answer: 30s (negotiation can take time)
#    - ICE candidates: 30s (gathering can be slow with TURN)
#    - Status queries: 10s (quick status check)
#    - Cleanup: 15s (graceful shutdown)
#
# 4. Buffering:
#    - All WebRTC routes have proxy_buffering off
#    - Ensures low-latency signaling
#    - Critical for real-time communication
#
# 5. Body Size:
#    - SDP offer endpoint allows up to 10M
#    - Accommodates large SDP payloads with multiple codecs/candidates
#
# 6. WebRTC Media:
#    - Nginx does NOT handle WebRTC media streams (audio/video)
#    - Media flows peer-to-peer or via TURN server (not through Nginx)
#    - Only signaling (SDP/ICE) goes through Nginx
#
# ================================================================
