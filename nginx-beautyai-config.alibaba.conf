# ================================================================
# BeautyAI Nginx Configuration - Alibaba Cloud
# ================================================================
# Version: 2.0-Alibaba (WebRTC Migration Phase F)
# Date: October 16, 2025
# Domains: web.lumidev.ca (Frontend), api.lumidev.ca (Backend API)
# SSL: Let's Encrypt certificates
# ================================================================

# HTTP Redirects (port 80) - redirect to HTTPS
server {
    listen 80;
    server_name web.lumidev.ca api.lumidev.ca;
    
    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ================================================================
# WEB UI SERVER: https://web.lumidev.ca (Frontend Application)
# ================================================================
server {
    listen 443 ssl http2;
    server_name web.lumidev.ca;

    # SSL certificate configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/web.lumidev.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.lumidev.ca/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ================================================================
    # WEBRTC VOICE SIGNALING ENDPOINTS (Phase F)
    # CRITICAL: These must come BEFORE the generic /api/ location
    # ================================================================
    
    # WebRTC Health Check
    location /api/v1/webrtc/voice/health {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # WebRTC SDP Offer/Answer Exchange
    location /api/v1/webrtc/voice/offer {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/offer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        client_max_body_size 10M;
        proxy_buffering off;
    }

    # WebRTC ICE Candidate Exchange
    location /api/v1/webrtc/voice/ice {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/ice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # WebRTC Session Status (with peer_id)
    location ~ ^/api/v1/webrtc/voice/([a-zA-Z0-9_-]+)/status$ {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/$1/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # WebRTC Session Cleanup (with peer_id)
    location ~ ^/api/v1/webrtc/voice/([a-zA-Z0-9_-]+)$ {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    # ================================================================
    # WEBSOCKET ENDPOINTS for web.lumidev.ca (Frontend WebSocket requests)
    # ================================================================
    location /api/v1/ws/simple-voice-chat {
        proxy_pass http://localhost:8000/api/v1/ws/simple-voice-chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings - CRITICAL
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/v1/ws/streaming-voice {
        proxy_pass http://localhost:8000/api/v1/ws/streaming-voice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ================================================================
    # DEBUG LOCATION
    location /api/debug {
        return 200 "nginx api proxy working - $request_uri\n";
        add_header Content-Type text/plain;
    }

    # API ENDPOINTS for web.lumidev.ca (Backend API requests)
    # ================================================================
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API specific settings
        client_max_body_size 100M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ================================================================
    # FRONTEND APPLICATION (default location)
    # ================================================================
    location / {
        proxy_pass http://localhost:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Standard proxy settings for frontend
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ================================================================
# API SERVER: https://api.lumidev.ca (BeautyAI API & WebSocket)
# ================================================================
server {
    listen 443 ssl http2;
    server_name api.lumidev.ca;

    # SSL certificate configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.lumidev.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lumidev.ca/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # CORS headers are forwarded from the upstream FastAPI service.
    # Preflight OPTIONS requests are proxied upstream so they receive the
    # single Access-Control-* header set by CORSMiddleware.

    # ================================================================
    # WEBRTC VOICE SIGNALING ENDPOINTS (Phase F)
    # CRITICAL: These must come BEFORE other location blocks
    # ================================================================
    
    # WebRTC Health Check
    location /api/v1/webrtc/voice/health {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # WebRTC SDP Offer/Answer Exchange
    location /api/v1/webrtc/voice/offer {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/offer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        client_max_body_size 10M;
        proxy_buffering off;
    }

    # WebRTC ICE Candidate Exchange
    location /api/v1/webrtc/voice/ice {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/ice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # WebRTC Session Status (with peer_id)
    location ~ ^/api/v1/webrtc/voice/([a-zA-Z0-9_-]+)/status$ {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/$1/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # WebRTC Session Cleanup (with peer_id)
    location ~ ^/api/v1/webrtc/voice/([a-zA-Z0-9_-]+)$ {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    # ================================================================
    # WEBSOCKET ENDPOINTS: wss://api.lumidev.ca/api/v1/ws/
    # ================================================================
    # Explicit high-priority block for the new streaming voice endpoint
    location /api/v1/ws/streaming-voice {
        proxy_pass http://localhost:8000/api/v1/ws/streaming-voice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api/v1/ws/ {
        proxy_pass http://localhost:8000/api/v1/ws/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ================================================================
    # LEGACY WEBSOCKET ENDPOINTS: wss://api.lumidev.ca/ws/ (for backward compatibility)
    # ================================================================
    location /ws/ {
        proxy_pass http://localhost:8000/ws/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ================================================================
    # ALL OTHER API ENDPOINTS
    # ================================================================
    location / {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API specific settings
        client_max_body_size 100M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
