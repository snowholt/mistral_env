<!DOCTYPE html>
<html>
<head>
    <title>Simple WebRTC Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
        #log { background: #f0f0f0; padding: 10px; height: 400px; overflow-y: scroll; margin-top: 20px; font-family: monospace; font-size: 12px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🎤 Simple WebRTC Audio Test</h1>
    <p>This test captures audio and sends it via WebRTC to the server.</p>
    
    <button id="start" onclick="start()">Start Capture</button>
    <button id="stop" onclick="stop()" disabled>Stop Capture</button>
    
    <div id="log"></div>
    
    <script>
        // Use current window location to avoid hardcoded IPs
        const API = window.location.protocol === 'https:' 
            ? `${window.location.protocol}//${window.location.host}`
            : 'http://localhost:8000';
        let pc, stream, peerId;
        
        function log(msg, type = 'info') {
            const div = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            div.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
            console.log(msg);
        }
        
        async function start() {
            try {
                log('🎤 Getting microphone...', 'info');
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('✅ Got microphone', 'success');
                
                // Create peer connection with STUN and TURN
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { 
                            urls: 'turn:188.48.209.107:15478',
                            username: 'beautyai',
                            credential: 'beautyai2025'
                        }
                    ]
                });
                
                // Add track
                stream.getTracks().forEach(track => {
                    pc.addTrack(track, stream);
                    log(`📡 Added track: ${track.kind}`, 'info');
                });
                
                // Monitor states
                pc.oniceconnectionstatechange = () => {
                    log(`🔌 ICE: ${pc.iceConnectionState}`, 'info');
                };
                
                pc.onconnectionstatechange = () => {
                    log(`🔗 Connection: ${pc.connectionState}`, 'info');
                };
                
                pc.onicecandidate = async (e) => {
                    if (e.candidate && peerId) {
                        log(`📤 Sending ICE candidate`, 'info');
                        try {
                            await fetch(`${API}/api/v1/webrtc/debug/voice-capture/ice`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    peer_id: peerId,
                                    candidate: e.candidate.candidate,
                                    sdp_mid: e.candidate.sdpMid,
                                    sdp_m_line_index: e.candidate.sdpMLineIndex
                                })
                            });
                        } catch (err) {
                            log(`❌ ICE send error: ${err}`, 'error');
                        }
                    }
                };
                
                // Create and send offer
                log('📝 Creating offer...', 'info');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                log('📤 Sending offer to server...', 'info');
                const resp = await fetch(`${API}/api/v1/webrtc/debug/voice-capture/offer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: offer.sdp, type: 'offer' })
                });
                
                if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
                
                const data = await resp.json();
                peerId = data.peer_id;
                log(`✅ Got peer ID: ${peerId}`, 'success');
                
                // Set remote description
                await pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
                log('✅ Set remote description', 'success');
                
                // Wait for connection
                await new Promise(resolve => {
                    const check = setInterval(() => {
                        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                            clearInterval(check);
                            resolve();
                        } else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') {
                            clearInterval(check);
                            resolve();
                        }
                    }, 100);
                });
                
                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    log('🎉 CONNECTED! Audio is flowing!', 'success');
                    document.getElementById('start').disabled = true;
                    document.getElementById('stop').disabled = false;
                } else {
                    log(`❌ Connection failed: ${pc.iceConnectionState}`, 'error');
                }
                
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
                console.error(err);
            }
        }
        
        async function stop() {
            try {
                log('🛑 Stopping...', 'info');
                
                if (peerId) {
                    await fetch(`${API}/api/v1/webrtc/debug/voice-capture/${peerId}`, {
                        method: 'DELETE'
                    });
                }
                
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                
                if (pc) {
                    pc.close();
                }
                
                log('✅ Stopped', 'success');
                document.getElementById('start').disabled = false;
                document.getElementById('stop').disabled = true;
                
            } catch (err) {
                log(`❌ Stop error: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
