# ================================================================
# WebRTC Voice Signaling Routes Configuration
# ================================================================
# This configuration snippet adds WebRTC signaling endpoints to Nginx
# Include this in the existing /etc/nginx/sites-enabled/gmai.sa configuration
#
# Usage:
#   1. Copy this snippet into the appropriate server blocks
#   2. Test with: sudo nginx -t
#   3. Reload with: sudo systemctl reload nginx
#
# Created for: BeautyAI WebRTC Migration Phase F
# Date: October 15, 2025
# ================================================================

# ================================================================
# FOR dev.gmai.sa SERVER BLOCK (Frontend → Backend API)
# Add these WebRTC routes BEFORE the generic /api/ location block
# ================================================================

    # WebRTC Voice Signaling - Health Check
    location /api/v1/webrtc/voice/health {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Quick timeout for health checks
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 5s;
        
        # No buffering for health checks
        proxy_buffering off;
    }

    # WebRTC Voice Signaling - SDP Offer/Answer Exchange
    location /api/v1/webrtc/voice/offer {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/offer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebRTC signaling timeouts (SDP negotiation can take a moment)
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        
        # Allow larger SDP payloads
        client_max_body_size 10M;
        proxy_buffering off;
    }

    # WebRTC Voice Signaling - ICE Candidate Exchange
    location /api/v1/webrtc/voice/ice {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/ice;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ICE gathering can take time, especially with TURN servers
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        
        # No buffering for ICE candidates
        proxy_buffering off;
    }

    # WebRTC Voice Signaling - Session Status Query
    location ~ ^/api/v1/webrtc/voice/([a-zA-Z0-9_-]+)/status$ {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/$1/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Quick status queries
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # WebRTC Voice Signaling - Session Cleanup
    location ~ ^/api/v1/webrtc/voice/([a-zA-Z0-9_-]+)$ {
        proxy_pass http://localhost:8000/api/v1/webrtc/voice/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cleanup operations
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

# ================================================================
