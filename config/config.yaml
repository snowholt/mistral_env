# BeautyAI Configuration
# Environment: development

# ========== Cluster Configuration (Distributed Architecture) ==========
cluster:
  # Mode: standalone (single server), master (coordinates slaves), slave (registers with master)
  mode: "standalone"  # Options: standalone, master, slave
  
  # Redis URL for distributed coordination (required for master/slave modes)
  redis_url: "redis://localhost:6379/0"
  
  # Server identification (auto-generated if not set)
  server_id: null  # e.g., "gpu-server-1"
  
  # Public URL for client redirects (important for cross-network WebRTC)
  # This is the URL clients will use to connect directly to this server
  public_url: null  # e.g., "https://voice1.example.com"
  
  # Master URL (required for slave mode)
  master_url: null  # e.g., "https://voice-master.example.com"
  
  # LLM Pool configuration
  llm_pool_size: 1  # Number of LLM instances to load (set to 2 for dual-LLM on 24GB GPU)
  
  # Heartbeat settings
  heartbeat_interval_s: 5.0
  heartbeat_timeout_s: 15.0
  
  # Session TTL for distributed sessions
  session_ttl_s: 3600  # 1 hour

duplex:
  # TTS Configuration
  tts_model: "edge-tts"
  tts_voice: "ar-SA-ZariyahNeural"
  tts_streaming_enabled: true
  tts_chunk_size_ms: 40
  tts_format: "opus"
  
  # Echo Suppression
  echo_suppression_enabled: true
  echo_correlation_threshold: 0.15
  echo_spectral_threshold: 0.12
  echo_vad_threshold: 0.05
  echo_adaptive_threshold: true
  
  # Jitter Buffer
  jitter_buffer_target_ms: 60
  jitter_buffer_max_ms: 200
  jitter_buffer_adaptive: true
  
  # Duplex Mode
  duplex_mode: "full"  # full, half, auto
  barge_in_enabled: true
  barge_in_sensitivity: 0.3
  barge_in_delay_ms: 300
  
  # Audio Buffers
  audio_buffer_size_ms: 10000  # 10 seconds
  pcm_buffer_size_samples: 16000
  
  # Session Management
  max_concurrent_sessions: 10
  session_timeout_ms: 300000  # 5 minutes

# WebRTC Voice Configuration (Phase A - WebRTC Migration)
webrtc:
  # Feature Toggle
  enabled: false  # Set to true to enable WebRTC mode
  
  # Utterance Limits
  max_utterance_sec: 10  # Maximum utterance duration in seconds
  
  # Signaling
  signaling_path: "/api/v1/webrtc/voice"  # FastAPI endpoint prefix
  
  # ICE Configuration
  stun_servers:
    - "stun:stun.l.google.com:19302"  # Google public STUN
  turn_servers: []  # Add TURN servers for production
  ice_transport_policy: "all"  # all, relay
  
  # VAD Configuration
  vad_webrtc_sensitivity: 3  # 0-3 (0=least aggressive, 3=most aggressive)
  vad_silero_sensitivity: 0.45  # 0-1 threshold for English
  vad_silero_sensitivity_arabic: 0.5  # 0-1 threshold for Arabic
  
  # Buffer Configuration
  buffer_pre_roll_ms: 300  # Pre-recording buffer (ms)
  buffer_post_roll_ms: 300  # Post-recording buffer (ms)
  
  # LLM Integration
  auto_no_think_prefix: true  # Automatically inject /no_think prefix
  
  # Debugging
  debug_logging: false  # Enable aiortc debug logs

system:
  # GPU Configuration
  gpu_enabled: true
  gpu_memory_fraction: 0.8
  gpu_memory_growth: true
  
  # Logging
  log_level: "INFO"
  log_format: "json"
  log_file: null
  
  # Caching
  cache_dir: "./cache"
  model_cache_size_gb: 10
  
  # API Settings
  api_timeout_s: 30
  max_request_size_mb: 100
  
  # Monitoring
  metrics_enabled: true
  tracing_enabled: false
  health_check_interval_s: 30

models:
  # Default Models - Genius AI Fine-tuned Models
  default_asr_model: "genius-whisper-arabic"
  default_llm_model: "qwen3-unsloth-q4ks"
  default_tts_model: "genius-xtts-arabic"
  
  # Model Loading - Enable persistent preloading
  model_load_timeout_s: 120
  model_unload_delay_s: 300
  preload_models: ["qwen3-unsloth-q4ks", "genius-whisper-arabic", "genius-xtts-arabic"]
  
  # Quantization
  quantization_enabled: true
  quantization_bits: 8